<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e3a8a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#primaryGrad)"/>
  
  <!-- Subtle Inner Border / Glow -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>

  <!-- Main Monogram 'F' for Feel -->
  <g filter="url(#subtleShadow)">
    <path d="M148 116 h140 c22 0 38 16 38 38 v4 c0 22 -16 38 -38 38 h-72 v60 h64 c20 0 34 14 34 34 v4 c0 20 -14 34 -34 34 h-64 v104 c0 22 -16 38 -38 38 h-4 c-22 0 -38 -16 -38 -38 V154 c0 -22 16 -38 38 -38 z" 
          fill="#ffffff"/>
  </g>

  <!-- Vibrant Flame / Spark Accenting 'Desire' -->
  <g filter="url(#subtleShadow)">
    <path d="M312 376 c-12 -36 -4 -76 18 -108 c8 32 30 52 46 64 c26 -44 14 -102 -22 -148 c68 40 98 112 76 180 c-18 56 -74 88 -130 76 c24 -16 40 -38 12 -64 z" 
          fill="url(#flameGrad)"/>
    <circle cx="340" cy="164" r="14" fill="#fbbf24"/>
  </g>
</svg>
